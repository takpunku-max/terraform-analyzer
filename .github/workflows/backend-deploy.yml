name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 895112955219.dkr.ecr.us-east-1.amazonaws.com

      - name: Build and push Docker image
        run: |
          docker buildx build --platform linux/amd64 --provenance=false \
            -t 895112955219.dkr.ecr.us-east-1.amazonaws.com/terraform-analyzer-backend:latest \
            --push backend/

      - name: Update Lambda
        run: |
          aws lambda update-function-code \
            --function-name terraform-analyzer-backend \
            --image-uri 895112955219.dkr.ecr.us-east-1.amazonaws.com/terraform-analyzer-backend:latest

            